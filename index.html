<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Hex 9x9 AI</title>
    <!-- Biblioteka ONNX -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="hex_logic.js"></script>
    <script src="bots.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e1e1e; color: #f5f5f5; }
        .board { display: inline-block; margin-top: 30px; }
        .row { display: flex; }
        .cell {
            width: 38px; height: 38px; margin: 2px;
            background-color: #555; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s;
        }
        .cell:hover { background-color: #777; }
        .cell.p0 { background-color: #3498db; cursor: default; } /* Niebieski gracz */
        .cell.p1 { background-color: #e74c3c; cursor: default; } /* Czerwony gracz */
        .controls { margin: 20px auto; padding: 15px; background: #2a2a2a; border-radius: 12px; width: fit-content; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select, button { padding: 10px 15px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 6px; border: none; }
        button { background-color: #2ecc71; color: white; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        #swapBtn { background-color: #f39c12; display: none; }
        #swapBtn:hover { background-color: #d68910; }
    </style>
</head>
<body>

    <h1>Hex 9x9 AI Engine</h1>
    <div class="controls">
        <label>Zagraj przeciwko: </label>
        <select id="botSelect">
            <option value="heuristic">Heurystyka (Grafowa - Agent 2)</option>
            <option value="ppo">PPO (Sieć Neuronowa)</option>
        </select>
        <button onclick="startGame()">Nowa Gra</button>
        <button id="swapBtn" onclick="applySwap()">Zastosuj SWAP</button>
    </div>
    
    <h3 id="statusText">Ładowanie silnika...</h3>
    <div id="boardContainer" class="board"></div>

    <script>
        let game = null;
        let ppoSession = null;
        const heuristicBot = new HeuristicBot(9);

        async function initApp() {
            document.getElementById("statusText").innerText = "Pobieranie modelu PPO (.onnx)...";
            try {
                // Upewnij się, że Twój model nazwałeś ppo_model.onnx
                ppoSession = await ort.InferenceSession.create('./ppo_model.onnx', { executionProviders: ['wasm'] });
            } catch (e) {
                console.warn("Nie udało się wczytać ppo_model.onnx. Działa tylko heurystyka.", e);
            }
            startGame();
        }

        function startGame() {
            game = new HexState(9);
            renderBoard();
            document.getElementById("statusText").innerText = "Twoja Tura! Jesteś Niebieski (łączysz Górę z Dołem).";
        }

        function renderBoard() {
            const container = document.getElementById("boardContainer");
            container.innerHTML = "";
            for (let r = 0; r < game.size; r++) {
                let row = document.createElement("div");
                row.className = "row";
                row.style.marginLeft = (r * 21) + "px"; // Tworzy wcięcie (skos) dla heksów
                for (let c = 0; c < game.size; c++) {
                    let cell = document.createElement("div");
                    cell.className = "cell";
                    let val = game.board[r * game.size + c];
                    if (val === 0) cell.classList.add("p0");
                    if (val === 1) cell.classList.add("p1");
                    
                    cell.onclick = () => playerMove(r * game.size + c);
                    row.appendChild(cell);
                }
                container.appendChild(row);
            }
            // Pokaż SWAP tylko po 1 ruchu bota (jeśli Ty zaczynasz jako drugi) lub swoim 1 ruchu
            if (game.movesPlayed === 1 && game.currentPlayer === 0) {
                document.getElementById("swapBtn").style.display = "inline-block";
            } else {
                document.getElementById("swapBtn").style.display = "none";
            }
        }

        async function playerMove(action) {
            if (game.isTerminal || game.currentPlayer !== 0 || game.board[action] !== -1) return;
            
            game.applyAction(action);
            renderBoard();
            checkWinState();

            if (!game.isTerminal) {
                document.getElementById("statusText").innerText = "Bot myśli...";
                setTimeout(botMove, 50); // Krótkie opóźnienie by UI zdążyło się odświeżyć
            }
        }

        function applySwap() {
            game.applyAction(game.swapAction);
            renderBoard();
            document.getElementById("statusText").innerText = "Zastosowano SWAP. Bot myśli...";
            setTimeout(botMove, 50);
        }

        async function botMove() {
            let action;
            let mode = document.getElementById("botSelect").value;
            
            if (mode === "ppo" && ppoSession) {
                action = await getPPOMove(game, ppoSession);
            } else {
                action = heuristicBot.step(game);
            }
            
            game.applyAction(action);
            renderBoard();
            checkWinState();
            
            if (!game.isTerminal) {
                document.getElementById("statusText").innerText = "Twoja Tura (Niebieski)";
            }
        }

        function checkWinState() {
            if (game.isTerminal) {
                if (game.currentPlayer === 1) { // Gracz po wykonaniu zwycięskiego ruchu jest zmieniony, stąd odwrócona logika
                    document.getElementById("statusText").innerText = "🎉 Wygrałeś!";
                } else {
                    document.getElementById("statusText").innerText = "🤖 Bot Wygrywa!";
                }
            }
        }

        // Start aplikacji po załadowaniu strony
        initApp();
    </script>
</body>
</html>
