<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex 9×9</title>
<style>
:root{--bg:#e8ecf0;--ink:#18222d;--mute:#5b6b7b;--panel:#fff;--line:#c3ccd5;--cell:#cfd8e0;--cellh:#b9c6d2;--black:#161a1f;--red:#d6383a;--accent:#2f5d8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:start center;padding:24px 14px}
main{width:min(100%,680px)}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--mute);max-width:56ch}
[hidden]{display:none!important}
.agents{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:18px}
@media(max-width:520px){.agents{grid-template-columns:1fr}}
.agent{text-align:left;font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:16px;cursor:pointer}
.agent:hover:not(:disabled){border-color:var(--mute)}
.agent[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,93,138,.18)}
.agent:disabled{opacity:.55;cursor:not-allowed}
.agent b{display:block;font-size:1.1rem;margin-bottom:4px}
.agent span{display:block;color:var(--mute);font-size:.92rem}
.agent i{display:block;margin-top:8px;font-style:normal;font-size:.85rem;color:var(--accent)}
button.go,button.sec{font:inherit;border-radius:8px;padding:10px 18px;cursor:pointer;border:2px solid var(--ink)}
button.go{background:var(--ink);color:#fff;font-weight:600}
button.go:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:transparent;color:var(--ink)}
button.swap{background:#f2b632;border-color:#f2b632;color:#3a2a00;font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:6px}
#status{font-weight:600;min-height:3em;margin:0}
#note{color:var(--mute);font-size:.9rem;min-height:1.4em;margin:0 0 4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block}
.cell{fill:var(--cell);stroke:#8fa0b0;stroke-width:1}
.cell.free.can{cursor:pointer}.cell.free.can:hover{fill:var(--cellh)}
.cell.p0{fill:var(--black)}.cell.p1{fill:var(--red)}
.cell.last{stroke:#f2b632;stroke-width:3}
.edge{fill:none;stroke-width:6;stroke-linecap:round;pointer-events:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:.9rem;margin-top:8px}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:6px}

/* MODAL (Koniec gry) */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(3px)}
.modal{background:var(--panel);padding:30px 40px;border-radius:12px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);max-width:400px;width:90%}
.modal h2{margin:0 0 10px;font-size:2rem;color:var(--ink)}
.modal p{color:var(--mute);margin:0 0 24px;font-size:1.1rem}
.modal .btn-group{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<main>
<h1>Hex 9×9</h1>

<section id="menu">
  <p class="sub">Choose your opponent. Connect your two opposite borders to win. The second player can use the SWAP rule to steal the first move.</p>
  <div class="agents">
    <button class="agent" id="a-heur" aria-pressed="false" data-agent="heuristic">
      <b>Heuristic Bot</b>
      <span>Uses 0-1 BFS to find shortest paths. Blocks your connections.</span>
    </button>
    <button class="agent" id="a-ppo_early" aria-pressed="false" data-agent="ppo_early">
      <b>PPO Bot (Early)</b>
      <span>Beginner stage of reinforcement learning.</span>
      <i id="state-ppo_early">Loading model...</i>
    </button>
    <button class="agent" id="a-ppo_mid" aria-pressed="false" data-agent="ppo_mid">
      <b>PPO Bot (Intermediate)</b>
      <span>Mid-training network.</span>
      <i id="state-ppo_mid">Loading model...</i>
    </button>
    <button class="agent" id="a-ppo_late" aria-pressed="false" data-agent="ppo_late">
      <b>PPO Bot (Advanced)</b>
      <span>Fully trained deep ResNet. Plays strong.</span>
      <i id="state-ppo_late">Loading model...</i>
    </button>
  </div>
  <button class="go" id="start" disabled>Play</button>
</section>

<section id="game" hidden>
  <div class="top">
    <p id="status" role="status" aria-live="polite"></p>
    <div class="ctl">
      <button class="swap go" id="swap" hidden>SWAP</button>
      <button class="sec" id="again">New Game</button>
      <button class="sec" id="back">Change Bot</button>
    </div>
  </div>
  <p id="note"></p>
  <svg id="board" aria-label="Hex 9x9 Board"></svg>
  <div class="legend">
    <span><i class="dot" style="background:var(--black)"></i>Black connects top & bottom (goes first)</span>
    <span><i class="dot" style="background:var(--red)"></i>Red connects left & right</span>
  </div>
</section>
</main>

<div id="overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Game Over</h2>
    <p id="modal-desc"></p>
    <div class="btn-group">
      <button class="go" id="modal-again">Play Again</button>
      <button class="sec" id="modal-menu">Menu</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
"use strict";
/* ============ GAME ENGINE ============ */
const N = 9, T = N * N, SWAP = T;
const DIRS = [[-1,0],[-1,1],[0,-1],[0,1],[1,-1],[1,0]];
const nbrs = Array.from({length: T}, (_, i) => {
  const r = (i / N) | 0, c = i % N, o = [];
  for (const [dr, dc] of DIRS) { const a = r + dr, b = c + dc; if (a >= 0 && a < N && b >= 0 && b < N) o.push(a * N + b); }
  return o;
});

class HexState {
  constructor() { this.board = Array(T).fill(-1); this.cur = 0; this.over = false; this.winner = null; this.moves = 0; this.first = null; }
  legal() {
    const a = []; this.board.forEach((v, i) => { if (v === -1) a.push(i); });
    if (this.moves === 1) a.push(SWAP);
    return a;
  }
  apply(a) {
    if (this.over) return;
    if (a === SWAP) {
      if (this.moves !== 1) return;
      this.board[this.first] = 1; this.cur = 0; this.moves++; return;
    }
    if (this.board[a] !== -1) return;
    this.board[a] = this.cur;
    if (this.moves === 0) this.first = a;
    if (this.win(this.cur)) { this.over = true; this.winner = this.cur; } else this.cur = 1 - this.cur;
    this.moves++;
  }
  win(p) {
    const seen = new Set(), st = [];
    for (let i = 0; i < N; i++) { const n = p === 0 ? i : i * N; if (this.board[n] === p) st.push(n); }
    while (st.length) {
      const c = st.pop(); if (seen.has(c)) continue; seen.add(c);
      if ((p === 0 && ((c / N) | 0) === N - 1) || (p === 1 && c % N === N - 1)) return true;
      for (const n of nbrs[c]) if (this.board[n] === p && !seen.has(n)) st.push(n);
    }
    return false;
  }
}

/* ============ HEURISTIC AGENT ============ */
const pick = a => a[(Math.random() * a.length) | 0];
const FAIR = []; for (let r = 1; r < N - 1; r++) for (let c = 1; c < N - 1; c++) { const d = Math.abs(r - 4) + Math.abs(c - 4); if (d === 2 || d === 3) FAIR.push(r * N + c); }

function dists(s, p, start) {
  const d = Array(T).fill(Infinity), q = [];
  for (let i = 0; i < N; i++) {
    const n = p === 0 ? (start ? i : (N - 1) * N + i) : (start ? i * N : i * N + N - 1);
    if (s.board[n] === p) { d[n] = 0; q.unshift(n); } else if (s.board[n] === -1) { d[n] = 1; q.push(n); }
  }
  while (q.length) {
    const c = q.shift();
    for (const n of nbrs[c]) {
      if (s.board[n] === 1 - p) continue;
      const w = s.board[n] === p ? 0 : 1;
      if (d[c] + w < d[n]) { d[n] = d[c] + w; w ? q.push(n) : q.unshift(n); }
    }
  }
  return d;
}
const lexLess = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return true; if (a[i] > b[i]) return false; } return false; };
const lexEq = (a, b) => a.every((v, i) => v === b[i]);

function heuristicStep(s) {
  const legal = s.legal(), c0 = N >> 1;
  if (s.moves === 0) {
    if (Math.random() < 0.25) {
      const m = legal.filter(a => Math.abs(((a / N) | 0) - c0) <= 2 && Math.abs(a % N - c0) <= 2);
      if (m.length) return pick(m);
    }
    const o = FAIR.filter(a => legal.includes(a)); if (o.length) return pick(o);
  }
  if (s.moves === 1 && legal.includes(SWAP)) {
    const r = (s.first / N) | 0, c = s.first % N;
    if (Math.abs(r - c0) <= 2 && Math.abs(c - c0) <= 2) return SWAP;
  }
  const p = s.cur, o = 1 - p;
  const bs = dists(s, p, true), be = dists(s, p, false), os = dists(s, o, true), oe = dists(s, o, false);
  let best = null, acts = [];
  for (const a of legal) {
    if (a === SWAP) continue;
    const bp = bs[a] + be[a], op = os[a] + oe[a];
    const t = [Math.min(bp, op + 0.1), bp + op, Math.abs(((a / N) | 0) - c0) + Math.abs(a % N - c0)];
    if (best === null || lexLess(t, best)) { best = t; acts = [a]; } else if (lexEq(t, best)) acts.push(a);
  }
  return acts.length ? pick(acts) : pick(legal);
}

/* ============ PPO AGENTS (ONNX) ============ */
const ppoAgents = ['ppo_early', 'ppo_mid', 'ppo_late'];
const ppoSess = { ppo_early: null, ppo_mid: null, ppo_late: null };
const ppoState = { ppo_early: 'loading', ppo_mid: 'loading', ppo_late: 'loading' };

const mapAct = (a, p, rot) => {
  if (a === SWAP) return a;
  let r = (a / N) | 0, c = a % N;
  if (rot) { r = N - 1 - r; c = N - 1 - c; }
  if (p === 1) [r, c] = [c, r];
  return r * N + c;
};

// Zmieniono na DETERMINISTIC = TRUE (Argmax)
async function ppoStep(s, p, rot, agentId) {
  const sess = ppoSess[agentId];
  const x = new Float32Array(3 * T);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    let rr = rot ? N - 1 - r : r, rc = rot ? N - 1 - c : c;
    if (p === 1) [rr, rc] = [rc, rr];
    const v = s.board[rr * N + rc];
    x[(v === p ? 0 : v === -1 ? 2 : 1) * T + r * N + c] = 1;
  }
  const L = new Set(s.legal());
  const res = await sess.run({ [sess.inputNames[0]]: new ort.Tensor('float32', x, [1, 3, N, N]) });
  const lg = Object.values(res).find(t => t.data.length === T + 1).data;
  
  let bestLogit = -Infinity, ch = -1;
  for (let a = 0; a <= T; a++) {
    if (L.has(mapAct(a, p, rot)) && lg[a] > bestLogit) {
      bestLogit = lg[a];
      ch = a;
    }
  }
  return mapAct(ch, p, rot);
}

/* ============ UI & INTERACTIONS ============ */
const $ = id => document.getElementById(id);
const NAME = ['Black', 'Red'];
let agent = 'ppo_late';
let st, human, rot, gameId = 0, busy = false, last = -1;

const R = 25, DX = Math.sqrt(3) * R, DY = 1.5 * R, OX = 18 + DX / 2, OY = 18 + R;
const ctr = (r, c) => [OX + c * DX + r * DX / 2, OY + r * DY];
const vert = (r, c, k) => { const [x, y] = ctr(r, c), a = (60 * k - 30) * Math.PI / 180; return [x + R * Math.cos(a), y + R * Math.sin(a)]; };

function buildBoard() {
  const svg = $('board'), ns = 'http://www.w3.org/2000/svg';
  svg.setAttribute('viewBox', `0 0 ${13 * DX + 36} ${8 * DY + 2 * R + 36}`);
  svg.innerHTML = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const p = document.createElementNS(ns, 'polygon');
    p.setAttribute('points', [0,1,2,3,4,5].map(k => vert(r, c, k).join(',')).join(' '));
    p.id = 'c' + (r * N + c); p.addEventListener('click', () => click(r * N + c));
    svg.appendChild(p);
  }
  const edge = (r, c, k1, k2, color) => {
    const [x1, y1] = vert(r, c, k1), [x2, y2] = vert(r, c, k2), l = document.createElementNS(ns, 'path');
    l.setAttribute('d', `M${x1} ${y1}L${x2} ${y2}`); l.setAttribute('class', 'edge'); l.style.stroke = color; svg.appendChild(l);
  };
  for (let c = 0; c < N; c++) { edge(0, c, 4, 5, 'var(--black)'); edge(0, c, 5, 0, 'var(--black)'); edge(N-1, c, 1, 2, 'var(--black)'); edge(N-1, c, 2, 3, 'var(--black)'); }
  for (let r = 0; r < N; r++) {
    edge(r, 0, 3, 4, 'var(--red)'); if (r < N - 1) edge(r, 0, 2, 3, 'var(--red)');
    edge(r, N-1, 0, 1, 'var(--red)'); if (r > 0) edge(r, N-1, 5, 0, 'var(--red)');
  }
}

function handleGameOver() {
  const humanWon = st.winner === human;
  $('modal-title').textContent = humanWon ? 'You Win! 🎉' : 'Bot Wins';
  $('modal-title').style.color = humanWon ? 'var(--accent)' : 'var(--red)';
  $('modal-desc').textContent = humanWon 
    ? 'Great job connecting the borders!' 
    : 'Better luck next time.';
  $('overlay').hidden = false;
}

function render(msg) {
  const humanTurn = !st.over && st.cur === human && !busy;
  for (let i = 0; i < T; i++) {
    const v = st.board[i];
    $('c' + i).setAttribute('class', 'cell' + (v === -1 ? ' free' + (humanTurn ? ' can' : '') : ' p' + v) + (i === last ? ' last' : ''));
  }
  $('swap').hidden = !(humanTurn && st.moves === 1);
  let t;
  if (st.over) {
    t = st.winner === human ? 'You win! 🎉' : 'Bot wins.';
    if ($('overlay').hidden) setTimeout(handleGameOver, 400); // Pokazuje Modal
  }
  else if (st.cur === human) t = 'Your turn. ' + (st.moves === 1 ? 'You can also use SWAP.' : '');
  else t = 'Bot is thinking...';
  
  $('status').textContent = `You play as ${NAME[human]}. ` + t;
  $('note').textContent = msg || '';
}

function newGame() {
  $('overlay').hidden = true;
  gameId++; busy = false; last = -1;
  st = new HexState(); human = Math.random() < .5 ? 0 : 1; rot = Math.random() < .5;
  render(human === 0 ? 'Coin flip: you start.' : 'Coin flip: bot starts. You can use SWAP after its first move.');
  if (st.cur !== human) botTurn(gameId);
}

function click(a) {
  if (st.over || busy || st.cur !== human || st.board[a] !== -1) return;
  st.apply(a); last = a; render();
  if (!st.over) botTurn(gameId);
}

$('swap').onclick = () => {
  if (st.over || busy || st.cur !== human || st.moves !== 1) return;
  st.apply(SWAP); last = st.first; render('You used SWAP. The first piece is now yours.');
  if (!st.over) botTurn(gameId);
};

async function botTurn(id) {
  busy = true; render();
  await new Promise(r => setTimeout(r, 500));
  if (id !== gameId) return;
  try {
    const bot = 1 - human;
    const a = agent.startsWith('ppo') ? await ppoStep(st, bot, rot, agent) : heuristicStep(st);
    if (id !== gameId) return;
    st.apply(a); busy = false;
    if (a === SWAP) { last = st.first; render('Bot used SWAP. It stole your first piece.'); }
    else { last = a; render(); }
    if (!st.over && st.cur !== human) botTurn(id);
  } catch (e) { busy = false; console.error(e); render('Bot error: ' + e.message); }
}

/* MENU */
function paintMenu() {
  if (agent.startsWith('ppo') && ppoState[agent] !== 'ready') {
    // If selected agent isn't ready yet, fallback visually to heuristic (or keep button selected but disable 'Play')
  }
  
  $('a-heur').setAttribute('aria-pressed', agent === 'heuristic');
  
  ppoAgents.forEach(id => {
    $(`a-${id}`).setAttribute('aria-pressed', agent === id);
    $(`a-${id}`).disabled = ppoState[id] !== 'ready';
    $(`state-${id}`).textContent = {
      loading: 'Loading model...',
      ready: 'Model ready',
      error: `Failed to load ${id}.onnx`
    }[ppoState[id]];
  });
  
  $('start').disabled = agent.startsWith('ppo') ? (ppoState[agent] !== 'ready') : false;
}

document.querySelectorAll('.agent').forEach(b => b.onclick = () => { 
  if (!b.disabled) { agent = b.dataset.agent; paintMenu(); } 
});

$('start').onclick = () => {$('menu').hidden = true; $('game').hidden = false; newGame(); };$('again').onclick = newGame;
$('modal-again').onclick = newGame;
$('back').onclick = () => {$('overlay').hidden = true; gameId++; busy = false; $('game').hidden = true; $('menu').hidden = false; paintMenu(); };
$('modal-menu').onclick =$('back').onclick;

buildBoard(); paintMenu();
ort.env.wasm.numThreads = 1;

// Asynchronous loading of all 3 models
ppoAgents.forEach(id => {
  ort.InferenceSession.create(`${id}.onnx`, { executionProviders: ['wasm'] })
    .then(s => { ppoSess[id] = s; ppoState[id] = 'ready'; paintMenu(); })
    .catch(e => { console.error(`Error loading ${id}.onnx:`, e); ppoState[id] = 'error'; paintMenu(); });
});
</script>
</body>
</html>
